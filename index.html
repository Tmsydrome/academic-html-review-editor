<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HTML修订批注工具 v0.4.4</title>
<style>
:root{--bg:#e9eef3;--panel:#fff;--ink:#17212b;--muted:#687787;--line:#d5dce3;--accent:#2563eb;--paper:#fff;--paper-ink:#222}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:600 14px "Microsoft YaHei",Arial,sans-serif;transition:.2s}
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--panel) 94%,transparent);border-bottom:1px solid var(--line);backdrop-filter:blur(12px);box-shadow:0 2px 12px #13253b12}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:7px;max-width:1600px;margin:auto;padding:9px 14px}.brand{font-weight:700;margin-right:5px;white-space:nowrap}.group{display:flex;gap:5px;padding-right:7px;border-right:1px solid var(--line)}
button,select,input[type=color]{height:34px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}button,select{padding:0 10px}button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}button:disabled,select:disabled{opacity:.42;cursor:not-allowed}.primary{background:var(--accent);border-color:var(--accent);color:#fff}.primary:hover:not(:disabled){color:#fff;filter:brightness(.95)}
.swatch{flex:0 0 25px;width:25px;height:25px;padding:0;border-radius:50%}.swatch[data-theme=white]{background:#dfe5eb}.swatch[data-theme=green]{background:#b9d3be}.swatch[data-theme=wood]{background:#d4b98f}.swatch[data-theme=dark]{background:#171b20}.swatch.active{outline:2px solid var(--accent);outline-offset:2px}input[type=color]{width:34px;padding:3px}
#status{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap}.creator-logo{flex:none;width:44px;height:44px;object-fit:cover;border:1px solid var(--line);border-radius:10px;box-shadow:0 3px 10px #2030401f}.designer-watermark{position:fixed;right:18px;bottom:9px;z-index:8;pointer-events:none;color:var(--muted);font:italic 700 12px "Segoe UI",Arial,sans-serif;letter-spacing:.12em;opacity:.42}.marker-wrap{position:relative}.marker-switch.active,.pen-switch.active{background:var(--accent);border-color:var(--accent);color:#fff}.marker-current{width:34px;padding:4px}.marker-current::before{content:"";display:block;width:20px;height:20px;margin:auto;border-radius:50%;background:var(--marker-current,#df3b35);box-shadow:0 0 0 1px #8896a3}.marker-menu{position:absolute;top:40px;left:0;z-index:30;display:flex;gap:6px;width:max-content;padding:8px;border:1px solid var(--line);border-radius:9px;background:var(--panel);box-shadow:0 8px 22px #20304022}.marker-menu[hidden]{display:none}.marker-color{width:28px;height:28px;padding:0;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #9aa7b2}.marker-color:hover{transform:scale(1.08)}.marker-color[data-marker=yellow]{background:#f5c518}.marker-color[data-marker=red]{background:#df3b35}.marker-color[data-marker=blue]{background:#2878d4}.marker-color[data-marker=green]{background:#3c9a53}.marker-color[data-marker=orange]{background:#ed7d21}.marker-color[data-marker=purple]{background:#8650b5}.marker-color[data-marker=gray]{background:#6e7b87}.pen-settings{align-items:center}.pen-settings label{display:flex;align-items:center;gap:5px;white-space:nowrap}.pen-settings input[type=range]{width:86px;accent-color:var(--accent)}.pen-settings output{min-width:20px;text-align:center}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;height:calc(100vh - 55px);padding:12px}.paper,aside{border:1px solid var(--line);border-radius:10px;background:var(--panel);box-shadow:0 6px 20px #2030400d;overflow:hidden}.paper iframe{width:100%;height:100%;border:0;display:block;background:var(--paper)}
aside{padding:14px;overflow:auto}aside h2{margin:0 0 10px;font-size:15px}.comment{margin:8px 0;padding:9px;border-left:3px solid #d2a800;border-radius:4px;background:#fff8d7;color:#252525;cursor:pointer}.comment small{display:block;margin-top:5px;color:#6b7784}.empty{color:var(--muted);font-size:12px;line-height:1.65}
#drop{position:fixed;inset:72px 22px 22px;z-index:20;display:grid;place-items:center;border:2px dashed #91a2b4;border-radius:14px;background:color-mix(in srgb,var(--panel) 94%,transparent);text-align:center;color:var(--muted);backdrop-filter:blur(8px)}#drop strong{display:block;margin-bottom:7px;color:var(--ink);font-size:21px}#drop.hidden{display:none}
@media(max-width:1050px){.brand{width:100%}#status{width:100%;margin:0}.layout{height:calc(100vh - 94px)}}@media(max-width:780px){.layout{grid-template-columns:1fr;height:auto}.paper{height:72vh}aside{height:25vh}.group{border:0}}

/* v0.4.4: compact start screen and developer identity */
body{background:linear-gradient(145deg,#f5f8fb 0%,#edf2f7 62%,#e7edf4 100%)}
header{background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(16px);box-shadow:0 4px 18px #13253b0d}
.bar{max-width:1800px;min-height:64px;padding:10px 18px;gap:9px}.brand{font-size:16px;font-weight:800;letter-spacing:-.02em}.group{align-items:center;gap:6px;padding-right:9px}
button,select,input[type=color]{height:38px;border-radius:10px;box-shadow:0 1px 2px #1f344c08;transition:border-color .16s,box-shadow .16s,transform .16s}button,select{padding:0 12px}button:hover:not(:disabled){box-shadow:0 4px 12px #2563eb12}button:active:not(:disabled){transform:translateY(1px)}.primary{box-shadow:0 5px 14px #2563eb28}.primary:hover:not(:disabled){box-shadow:0 7px 18px #2563eb35}
.creator-profile{display:flex;align-items:center;gap:9px;padding:4px 9px 4px 4px;border:1px solid transparent;border-radius:14px;color:var(--ink);text-decoration:none;transition:.16s}.creator-profile:hover{border-color:var(--line);background:color-mix(in srgb,var(--panel) 88%,transparent);box-shadow:0 5px 16px #20304012}.creator-logo{border-radius:12px;box-shadow:0 4px 14px #2030401a}.creator-meta{display:grid;gap:1px;min-width:76px;line-height:1.2}.creator-name{font-size:12px;font-weight:800}.creator-platform{font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.04em}.layout{gap:14px;height:calc(100vh - 64px);padding:14px}.paper,aside{border-radius:14px;box-shadow:0 8px 24px #2030400c}
#drop{inset:64px 0 0;padding:28px;border:0;border-radius:0;background:linear-gradient(145deg,#f7f9fc 0%,#eaf0f6 100%)}
.empty-card{width:min(520px,100%);padding:52px 36px 46px;border:1px solid #dbe4ed;border-radius:22px;background:#ffffffdb;box-shadow:0 18px 55px #22364e12;backdrop-filter:blur(12px)}
.empty-card strong{display:block;margin:0 0 10px;color:var(--ink);font-size:24px;letter-spacing:-.02em}.empty-card p{margin:0 0 24px;font-weight:500;line-height:1.75}.empty-card button{min-width:148px}.drop-hint{display:block;margin-top:15px;font-size:12px;font-weight:500;color:#8795a5}
body:not(.document-ready) .doc-tools,body:not(.document-ready) #mode{display:none}body:not(.document-ready) .layout{visibility:hidden}.document-ready .bar{max-width:none}.document-ready #status{margin-left:0}.document-ready .creator-profile{margin-left:auto}
@media(max-width:780px){.bar{padding:9px 12px}.brand{width:auto;font-size:15px}.creator-logo{width:40px;height:40px}.empty-card{padding:40px 22px}.empty-card strong{font-size:21px}}
</style>
</head>

<header><div class="bar">
  <span class="brand">HTML修订批注工具 v0.4.4</span>
  <div class="group"><button id="open" class="primary">导入HTML</button><select id="mode" disabled><option value="track">修订模式</option><option value="edit">直接编辑</option></select></div>

  <div class="group pen-settings doc-tools"><button id="penSwitch" class="pen-switch" disabled aria-pressed="false" title="打开后可在正文上自由绘画">画笔：关</button><label title="画笔粗细">粗细<input id="penSize" type="range" min="1" max="24" step="1" value="4" disabled><output id="penSizeValue">4</output></label><input id="penColor" type="color" value="#e53935" disabled title="自由选择画笔颜色"></div>
  <div class="group doc-tools"><button id="comment" disabled>添加批注</button><button id="accept" disabled>接受所选</button><button id="reject" disabled>拒绝所选</button><button id="acceptAll" disabled>接受全部</button><button id="rejectAll" disabled>拒绝全部</button></div>
  <div class="group doc-tools"><select id="exportType" disabled><option value="review">修订＋批注版</option><option value="clean">清洁＋批注版</option></select><button id="export" disabled>导出所选版本</button></div>

<script>

function historyButtons(){$('#undo').disabled=!ready||!undoStack.length;$('#redo').disabled=!ready||!redoStack.length}
function undo(){if(!undoStack.length)return;redoStack.push(snapshot());restore(undoStack.pop());status('已撤销')}
function redo(){if(!redoStack.length)return;undoStack.push(snapshot());restore(redoStack.pop());status('已重做')}

async function load(file){
  if(!file?.name.match(/\.html?$/i))return status('请选择HTML文件');fileName=file.name;
  frame.srcdoc=(await file.text()).replace(/<\/head>/i,editorStyle+'</head>');
  frame.onload=()=>{ready=true;document.body.classList.add('document-ready');undoStack=[];redoStack=[];commentNo=0;savedRange=null;markerMode=false;penMode=false;const d=doc();d.body.classList.add('review-editing');d.addEventListener('beforeinput',beforeInput,true);d.addEventListener('paste',paste,true);d.addEventListener('compositionstart',compositionStart);d.addEventListener('compositionend',compositionEnd);d.addEventListener('keydown',shortcuts,true);d.addEventListener('mouseup',autoMarkSelection);d.addEventListener('keyup',autoMarkSelection);d.addEventListener('pointerdown',drawStart,true);d.addEventListener('pointermove',drawMove,true);d.addEventListener('pointerup',drawEnd,true);d.addEventListener('pointercancel',drawEnd,true);d.addEventListener('pointerleave',hidePenCursor,true);setMode('track');document.querySelectorAll('button:not(#open),select,#penSize,#penColor').forEach(x=>x.disabled=false);ensureDrawingLayer();updateMarkerControls();updatePenControls();historyButtons();$('#drop').classList.add('hidden');applyTheme(currentTheme);drawComments();status('已导入并进入修订模式：'+fileName)};
}
function setMode(v){doc().body.contentEditable='true';mode.value=v;status(v==='edit'?'直接编辑模式':'修订模式')}
function rememberSelection(){const x=selection();if(x?.rangeCount&&!x.isCollapsed)savedRange=x.getRangeAt(0).cloneRange()}
function selectedRange(){const x=selection();return x?.rangeCount&&!x.isCollapsed?x.getRangeAt(0):savedRange?.cloneRange()}
const markerColors={yellow:{name:'黄色',text:'#7a5c00',bg:'#fff3a3'},red:{name:'红色',text:'#b3261e',bg:'#ffdeda'},blue:{name:'蓝色',text:'#1557a0',bg:'#dcecff'},green:{name:'绿色',text:'#256b32',bg:'#dcf1df'},orange:{name:'橙色',text:'#a84200',bg:'#ffe1ca'},purple:{name:'紫色',text:'#67248f',bg:'#efdcff'},gray:{name:'灰色',text:'#455a64',bg:'#e6ecef'}};
function parentAt(n){return n?.nodeType===1?n:n?.parentElement}
function markerAt(n){return parentAt(n)?.closest('[data-marker-color]')}

function updateMarkerControls(){const b=$('#markerSwitch'),c=$('#markerColorToggle'),color=markerColors[activeMarker];b.classList.toggle('active',markerMode);b.setAttribute('aria-pressed',String(markerMode));b.textContent='文本标记：'+(markerMode?'开':'关');c.style.setProperty('--marker-current',color.text);c.title='当前颜色：'+color.name}
function setMarkerMode(on){if(on&&penMode)setPenMode(false);markerMode=on;updateMarkerControls();$('#markerMenu').hidden=true;status('文本标记已'+(on?'开启，划选文字将自动上色':'关闭'))}
function setMarkerStyle(mark,key){const color=markerColors[key];mark.dataset.markerColor=key;mark.className='text-marker marker-'+key;mark.style.setProperty('color',color.text,'important');mark.style.setProperty('background-color',color.bg,'important');mark.style.setProperty('border-radius','2px');mark.style.setProperty('box-decoration-break','clone')}
function applyTextMarker(key,toggle=false){const r=selectedRange(),color=markerColors[key];if(!r||r.collapsed)return false;const first=markerAt(r.startContainer),last=markerAt(r.endContainer);if(first&&first===last){if(first.dataset.markerColor===key){if(toggle){push();unwrap(first);status('已取消'+color.name+'标记')}savedRange=null;return true}push();setMarkerStyle(first,key);savedRange=null;status('已改为'+color.name+'标记');return true}push();const mark=doc().createElement('span');setMarkerStyle(mark,key);try{r.surroundContents(mark)}catch{mark.appendChild(r.extractContents());r.insertNode(mark)}const x=selection(),after=doc().createRange();after.setStartAfter(mark);after.collapse(true);x.removeAllRanges();x.addRange(after);savedRange=null;status('已添加'+color.name+'标记');return true}

const SVG_NS='http://www.w3.org/2000/svg';

function ensurePenCursor(layer=ensureDrawingLayer()){if(!layer)return null;let cursor=layer.querySelector('#review-pen-cursor');if(!cursor){cursor=doc().createElementNS(SVG_NS,'circle');cursor.id='review-pen-cursor';cursor.dataset.toolTemporary='1';cursor.style.pointerEvents='none';layer.appendChild(cursor)}cursor.setAttribute('r',Math.max(.5,(penSize-1)/2));cursor.setAttribute('fill',penColor);cursor.setAttribute('fill-opacity','0.22');cursor.setAttribute('stroke',penColor);cursor.setAttribute('stroke-width','1');cursor.style.display='none';return cursor}
function updatePenControls(){const b=$('#penSwitch');b.classList.toggle('active',penMode);b.setAttribute('aria-pressed',String(penMode));b.textContent='画笔：'+(penMode?'开':'关');$('#penSizeValue').value=String(penSize);$('#penSizeValue').textContent=String(penSize)}
function setPenMode(on){penMode=on;if(on&&markerMode)setMarkerMode(false);drawing=false;currentStroke=null;const layer=ensureDrawingLayer();if(!on)hidePenCursor();else ensurePenCursor(layer);updatePenControls();status('画笔已'+(on?'开启，圆形光标表示实际粗细':'关闭，已恢复文字操作'))}

  else{const child=back?c.childNodes[o-1]:c.childNodes[o];const t=edgeText(child,back);if(t)return[t,back?t.length-1:0];let n=c;while(n&&n!==doc().body){const sib=back?n.previousSibling:n.nextSibling;if(sib){const q=edgeText(sib,back);if(q)return[q,back?q.length-1:0]}n=n.parentNode}}return null}
function erase(back){const x=selection();if(!x.rangeCount)return;const r=x.getRangeAt(0);if(!r.collapsed)return deleteRange(r);const hit=adjacent(back);if(!hit)return;const[n,o]=hit,q=doc().createRange();q.setStart(n,o);q.setEnd(n,o+1);const ins=n.parentElement.closest('ins[data-change]');if(ins){q.deleteContents();if(!ins.textContent&&!ins.querySelector('br'))ins.remove()}else deleteRange(q)}
function beforeInput(e){if(e.isComposing)return;const t=e.inputType||'';
  if(mode.value==='edit'){push();return}

  else if(t.startsWith('delete')){e.preventDefault();push();erase(t.includes('Backward'))}

function paste(e){if(mode.value!=='track')return;e.preventDefault();push();put(e.clipboardData.getData('text/plain'))}
function compositionStart(){

  const a=r.cloneRange(),b=r.cloneRange();b.collapse(false);b.insertNode(end);a.collapse(true);a.insertNode(start);const q=doc().createRange();q.setStartAfter(start);q.setEndBefore(end);x.removeAllRanges();x.addRange(q);compositionInfo.start=start;compositionInfo.end=end;

function compositionEnd(e){

  const x=selection();
  if(info.anchor?.isConnected){const n=info.inInsert?doc().createTextNode(e.data):change('ins',e.data),q=doc().createRange();info.anchor.replaceWith(n);q.setStartAfter(n);q.collapse(true);x.removeAllRanges();x.addRange(q);return}
  if(info.start?.isConnected&&info.end?.isConnected){const q=doc().createRange();q.setStartAfter(info.start);q.setEndBefore(info.end);q.deleteContents();if(info.inInsert){const text=doc().createTextNode(e.data);q.insertNode(text);info.start.remove();info.end.remove();q.setStartAfter(text)}else{const deleted=change('del'),inserted=change('ins',e.data);deleted.appendChild(info.fragment);q.insertNode(deleted);q.setStartAfter(deleted);q.insertNode(inserted);info.start.remove();info.end.remove();q.setStartAfter(inserted)}q.collapse(true);x.removeAllRanges();x.addRange(q);return}
  if(info.inInsert)return;if(!x.rangeCount)return;const r=x.getRangeAt(0),n=r.startContainer,o=r.startOffset,parent=n.nodeType===1?n:n.parentElement;if(parent.closest('ins[data-change]'))return;
  if(n.nodeType===3&&o>=e.data.length){const q=doc().createRange(),deleted=parent.closest('del[data-change]');q.setStart(n,o-e.data.length);q.setEnd(n,o);const ins=change('ins');ins.appendChild(q.extractContents());deleted?deleted.after(ins):q.insertNode(ins);q.setStartAfter(ins);q.collapse(true);x.removeAllRanges();x.addRange(q)}

function shortcuts(e){if(!(e.ctrlKey||e.metaKey))return;const k=e.key.toLowerCase();if(k==='z'){e.preventDefault();e.shiftKey?redo():undo()}else if(k==='y'){e.preventDefault();redo()}}
function chosen(){const x=selection();if(!x.rangeCount)return null;const n=x.anchorNode;return(n.nodeType===1?n:n.parentElement)?.closest('ins[data-change],del[data-change]')}
function unwrap(n){n.replaceWith(...n.childNodes)}function acceptNode(n){if(n)n.tagName==='DEL'?n.remove():unwrap(n)}function rejectNode(n){if(n)n.tagName==='INS'?n.remove():unwrap(n)}
function heading(node){for(let n=node;n;n=n.parentElement){let p=n.previousElementSibling;while(p){if(/^H[1-6]$/.test(p.tagName))return p.textContent.trim();p=p.previousElementSibling}}return'未识别章节'}
function addComment(){const x=selection();if(!x.rangeCount||x.isCollapsed)return status('请先选择需要批注的文字');const request=prompt('请输入给AI的编辑要求：');if(!request)return;push();const r=x.getRangeAt(0),n=doc().createElement('span'),id='C'+String(++commentNo).padStart(3,'0');n.className='review-comment';n.id='anchor-'+id;n.dataset.commentId=id;n.dataset.request=request;n.dataset.section=heading(r.startContainer.nodeType===1?r.startContainer:r.startContainer.parentElement);n.dataset.quote=r.toString();n.title=id+'：'+request;try{r.surroundContents(n)}catch{n.appendChild(r.extractContents());r.insertNode(n)}drawComments();status('已添加批注 '+id)}
function drawComments(){const box=$('#comments'),list=[...doc().querySelectorAll('[data-comment-id]')];if(!list.length){box.className='empty';box.textContent='当前没有批注。';return}box.className='';box.innerHTML='';list.forEach(n=>{const c=document.createElement('div');c.className='comment';c.innerHTML=`<b>${esc(n.dataset.commentId)}</b>　${esc(n.dataset.request)}<small>${esc(n.dataset.section)}｜${esc(n.dataset.quote||n.textContent).slice(0,80)}</small>`;c.onclick=()=>n.scrollIntoView({behavior:'smooth',block:'center'});box.appendChild(c)})}
function esc(t=''){return t.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function commentsData(out){return[...out.querySelectorAll('[data-comment-id]')].map(n=>({id:n.dataset.commentId,section:n.dataset.section,quote:n.dataset.quote||n.textContent,request:n.dataset.request}))}
function addSidebar(out,items){const side=out.createElement('aside');side.id='review-comments-sidebar';side.innerHTML='<h2>作者批注</h2>'+items.map(i=>`<article><b>${esc(i.id)}</b><p>${esc(i.request)}</p><small>${esc(i.section)}｜${esc(i.quote)}</small></article>`).join('');out.body.appendChild(side);const st=out.createElement('style');st.textContent='html,body{background:#fff!important}body{margin-right:330px!important}#review-comments-sidebar{position:fixed;right:0;top:0;width:310px;height:100vh;overflow:auto;background:#f7f8fa;color:#222;border-left:1px solid #ccd2d8;padding:16px;z-index:9999;font:13px Arial,sans-serif}#review-comments-sidebar h2{font-size:16px}#review-comments-sidebar article{background:#fff8d7;border-left:3px solid #d2a800;padding:9px;margin:9px 0}#review-comments-sidebar p{margin:5px 0}#review-comments-sidebar small{color:#66717c}@media(max-width:800px){body{margin-right:0!important}#review-comments-sidebar{position:static;width:auto;height:auto;border:0}}';out.head.appendChild(st)}
function exportDoc(clean){const out=doc().cloneNode(true),items=commentsData(out);out.body.contentEditable='false';out.body.classList.remove('review-editing','hide-review');out.querySelector('#review-tool-style')?.remove();out.querySelectorAll('[contenteditable]').forEach(n=>n.removeAttribute('contenteditable'));out.querySelector('#review-pen-cursor')?.remove();const drawingLayer=out.querySelector('#review-drawing-layer');if(drawingLayer){drawingLayer.style.pointerEvents='none';drawingLayer.style.cursor='auto'}

const themes={white:['#dfe5eb','#ffffff','#17212b','#ffffff','#222222'],green:['#c3d9c7','#eaf3e9','#173127','#e2efdf','#24352b'],wood:['#d4bea0','#f2e7d6','#3b2b20','#eadbc5','#342a22'],dark:['#12161a','#20262d','#eef3f8','#22282f','#edf2f7']};let currentTheme='white';

function luminance(hex){const n=parseInt(hex.slice(1),16);return(.2126*((n>>16)&255)+.7152*((n>>8)&255)+.0722*(n&255))/255}
